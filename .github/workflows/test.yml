name: test

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
        mongoose: ['7.8.13', '8.24.9']
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save mongoose@${{ matrix.mongoose }}
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
